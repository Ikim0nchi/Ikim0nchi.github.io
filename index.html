    <script>
        let selectedTags = [];

        function filterArticles() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.getElementsByClassName('article-item');
            for (let i = 0; i < items.length; i++) {
                let searchTarget = items[i].getAttribute('data-content').toLowerCase();
                let tagsAttr = items[i].getAttribute('data-tags');
                let articleTags = tagsAttr ? tagsAttr.split(',') : [];
                
                let matchesSearch = searchTarget.includes(input);
                let matchesTags = selectedTags.length === 0 || selectedTags.every(t => articleTags.includes(t));

                items[i].style.display = (matchesSearch && matchesTags) ? "" : "none";
            }
        }

        function filterByTag(tagName) {
            if (tagName === 'ALL') {
                selectedTags = [];
            } else {
                let index = selectedTags.indexOf(tagName);
                if (index > -1) {
                    selectedTags.splice(index, 1);
                } else {
                    selectedTags.push(tagName);
                }
            }

            let allBadge = document.getElementById('tag-all');
            if (selectedTags.length === 0) {
                allBadge.classList.add('active');
            } else {
                allBadge.classList.remove('active');
            }

            let badges = document.querySelectorAll('.tag-container .tag-badge:not(#tag-all)');
            for (let b of badges) {
                let t = b.getAttribute('data-tag');
                if (selectedTags.includes(t)) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            }

            filterArticles();
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tagParam = urlParams.get('tag');
            if (tagParam) {
                filterByTag(tagParam);
            }
        };
    </script>
